<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    
    <title>みんなの不動産ハザードマップ</title>
    <!-- LeafletのCSS読み込み -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            flex-direction: column; /* スマホは上下配置 */
        }

        /* --- サイドバー（操作パネル） --- */
        #sidebar {
            width: 100%;
            padding: 16px;
            background: #f8f9fa;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            z-index: 1000;
            max-height: 45vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #sidebar h2 {
            margin: 0;
            font-size: 1.15rem;
            color: #333;
        }

        /* --- 入力フォーム配置 --- */
        .input-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        input[type="text"] {
            padding: 8px 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
        }

        #addressInput {
            flex: 3 1 180px;
        }

        #memoInput {
            flex: 2 1 110px;
        }

        .btn-row {
            display: flex;
            gap: 8px;
        }

        button {
            padding: 8px 12px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #ffffff;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #f0f0f0;
        }

        .btn-primary {
            background-color: #0066cc;
            color: white;
            border: none;
            flex: 1;
        }

        .btn-primary:hover {
            background-color: #0052a3;
        }

        button#hazardBtn {
            background-color: #ffe6e6;
            color: #cc0000;
            border-color: #ffcccc;
            flex: 1;
        }

        /* --- 共有物件一覧 --- */
        .list-section {
            margin-top: 4px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .property-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            padding: 8px 10px;
            border-radius: 4px;
            border: 1px solid #e0e0e0;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            font-size: 13px;
        }

        .property-item span {
            cursor: pointer;
            color: #0066cc;
            text-decoration: underline;
            word-break: break-all;
            margin-right: 8px;
        }

        .delete-btn {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 4px 8px;
            font-size: 12px;
            border-radius: 3px;
            cursor: pointer;
            white-space: nowrap;
            flex: 0 0 auto;
        }

        .delete-btn:hover {
            background-color: #cc0000;
        }

        /* --- マップ本体 --- */
        #map {
            flex-grow: 1;
            width: 100%;
            height: 100%;
        }

        /* --- PC・タブレット向け（画面幅 768px 以上）: 左右2カラム構造 --- */
        @media (min-width: 768px) {
            body {
                flex-direction: row; /* 左右並び */
            }

            #sidebar {
                width: 340px;
                min-width: 340px;
                height: 100vh;
                max-height: 100vh;
                box-shadow: 2px 0 8px rgba(0,0,0,0.15);
            }

            .btn-row {
                flex-direction: column; /* PCではボタンを縦に並べて押しやすく */
            }

            #map {
                height: 100vh;
            }
        }

        /* パスワード認証画面 */
        #authOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 20px;
        }

        .auth-box {
            background: #222;
            padding: 25px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 320px;
        }

        .auth-box input[type="password"] {
            padding: 10px;
            font-size: 16px;
            width: 100%;
            margin-bottom: 12px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        .auth-box button {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            background-color: #0066cc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- パスワード認証画面 -->
    <div id="authOverlay">
        <div class="auth-box">
            <h3 style="margin-top:0;">合言葉を入力</h3>
            <input type="password" id="passInput" placeholder="パスワード">
            <button onclick="checkPassword()">ログイン</button>
            <p id="authError" style="color: #ff6666; display: none; margin-top: 10px; font-size: 0.85em;">パスワードが違います</p>
        </div>
    </div>

    <!-- サイドバー（操作パネル） -->
    <div id="sidebar">
        <h2>不動産ハザードマップ</h2>
        <div class="input-container">
            <div class="input-row">
                <input type="text" id="addressInput" placeholder="住所（例: 新宿区西新宿2-8-1）">
                <input type="text" id="memoInput" placeholder="メモ（家賃等）">
            </div>
            <div class="btn-row">
                <button class="btn-primary" onclick="searchAndSaveAddress()">物件を保存</button>
                <button onclick="toggleHazardMap()" id="hazardBtn">ハザードマップ: OFF</button>
            </div>
        </div>
        <div class="list-section">
            <strong>共有物件一覧:</strong>
            <div id="listContainer"></div>
        </div>
    </div>

    <!-- マップ表示領域 -->
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.2/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.5.2/firebase-firestore.js";

        const APP_PASSWORD = "4187";

        const firebaseConfig = {
            apiKey: "AIzaSyAyag5QHHJtslMjM4JsvW7WKtMAQTEodcI",
            authDomain: "fudosan-66b86.firebaseapp.com",
            projectId: "fudosan-66b86",
            storageBucket: "fudosan-66b86.firebasestorage.app",
            messagingSenderId: "48393275114",
            appId: "1:48393275114:web:2cb795277be188cd04f993",
            measurementId: "G-59BT0GBJ5C"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.checkPassword = function() {
            const input = document.getElementById('passInput').value;
            if (input === APP_PASSWORD) {
                document.getElementById('authOverlay').style.display = 'none';
                initApp();
            } else {
                document.getElementById('authError').style.display = 'block';
            }
        };

        document.getElementById('passInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                window.checkPassword();
            }
        });

        let map, hazardLayer, markersLayer;
        let isHazardOn = false;

        function initApp() {
            map = L.map('map').setView([35.681236, 139.767125], 13);

            L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
                maxZoom: 18,
                attribution: '&copy; <a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>'
            }).addTo(map);

            hazardLayer = L.tileLayer('https://disaportaldata.gsi.go.jp/raster/01_flood_l2_shinsuishin_data/{z}/{x}/{y}.png', {
                maxZoom: 17,
                minZoom: 2,
                opacity: 0.6,
                attribution: '<a href="https://disaportal.gsi.go.jp/">ハザードマップポータルサイト</a>'
            });

            markersLayer = L.layerGroup().addTo(map);

            onSnapshot(collection(db, "properties"), (snapshot) => {
                markersLayer.clearLayers();
                const listContainer = document.getElementById('listContainer');
                listContainer.innerHTML = '';

                snapshot.forEach((docSnap) => {
                    const prop = docSnap.data();
                    const id = docSnap.id;

                    const marker = L.marker([prop.lat, prop.lon])
                        .bindPopup(`<b>検討物件</b><br>${prop.address}<br>メモ: ${prop.memo || 'なし'}<br><a href="https://www.google.com/maps/search/?api=1&query=${prop.lat},${prop.lon}" target="_blank">Googleマップで見る</a>`);
                    markersLayer.addLayer(marker);

                    const item = document.createElement('div');
                    item.className = 'property-item';
                    item.innerHTML = `
                        <span onclick="window.focusMap(${prop.lat}, ${prop.lon})">${prop.address} (${prop.memo || 'メモなし'})</span>
                        <button class="delete-btn" data-id="${id}">削除</button>
                    `;
                    listContainer.appendChild(item);
                });

                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const id = e.target.getAttribute('data-id');
                        await deleteDoc(doc(db, "properties", id));
                    });
                });
            });
        }

        window.toggleHazardMap = function() {
            if (!map) return;
            const btn = document.getElementById('hazardBtn');
            if (isHazardOn) {
                map.removeLayer(hazardLayer);
                btn.style.backgroundColor = '#ffe6e6';
                btn.style.color = '#cc0000';
                btn.innerText = 'ハザードマップ: OFF';
                isHazardOn = false;
            } else {
                hazardLayer.addTo(map);
                btn.style.backgroundColor = '#e6ffe6';
                btn.style.color = '#008000';
                btn.innerText = 'ハザードマップ: ON';
                isHazardOn = true;
            }
        };

        window.focusMap = function(lat, lon) {
            if (map) map.setView([lat, lon], 16);
        };

        window.searchAndSaveAddress = async function() {
            if (!map) return;
            const address = document.getElementById('addressInput').value;
            const memo = document.getElementById('memoInput').value;

            if (!address) {
                alert('住所を入力してください');
                return;
            }

            const url = `https://msearch.gsi.go.jp/address-search/AddressSearch?q=${encodeURIComponent(address)}`;

            fetch(url)
                .then(response => response.json())
                .then(async data => {
                    if (data && data.length > 0) {
                        const coordinates = data[0].geometry.coordinates;
                        const lat = coordinates[1];
                        const lon = coordinates[0];
                        const computedAddress = data[0].properties.title;

                        await addDoc(collection(db, "properties"), {
                            address: computedAddress,
                            lat: lat,
                            lon: lon,
                            memo: memo
                        });

                        document.getElementById('addressInput').value = '';
                        document.getElementById('memoInput').value = '';

                        map.setView([lat, lon], 16);
                    } else {
                        alert('住所が見つかりませんでした。正確な住所を入力してください。');
                    }
                })
                .catch(error => {
                    console.error('エラー:', error);
                    alert('住所の検索に失敗しました。');
                });
        };
    </script>
</body>
</html>
